
version: "3"

services:
  devopsdb:
    image: shaikmustafa/harikanew:dbimage
    ports:
      - "3306:3306"
    deploy:
      replicas: 3
    networks:
      - mynet

  application:
    image: shaikmustafa/harikanew:appimage
    ports:
      - "1111:8080"
    deploy:
      replicas: 3
    networks:
      - mynet
    depends_on:
      - devopsdb

networks:
  mynet:
    driver: overlay
